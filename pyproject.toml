[project]
name = "ics-cal-mcp"
version = "1.1.20261005"
description = "Read-only MCP server that exposes published ICS calendar feeds (Outlook/Exchange, Google, iCloud, ...) as MCP tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kristof", email = "" }]
keywords = ["mcp", "ics", "icalendar", "calendar", "outlook", "exchange"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.10",
    "python-dateutil>=2.9",
    "tzdata>=2025.2",
]

[project.urls]
Homepage = "https://github.com/kspeeckaert/ics-cal-mcp"
Repository = "https://github.com/kspeeckaert/ics-cal-mcp"
Issues = "https://github.com/kspeeckaert/ics-cal-mcp/issues"

[project.scripts]
ics-cal-mcp = "ics_cal_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ics_cal_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["ics_cal_mcp"]
known-local-folder = ["conftest"]
